<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT Learning Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #050510;
            --card-bg: rgba(20, 20, 35, 0.6);
            --neon-cyan: #00f3ff;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            background-image:
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Roboto Mono', monospace;
            color: var(--text-main);
            min-height: 100vh;
        }

        .portal {
            min-height: 100vh;
            padding: 2rem 1.25rem 3rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; margin-bottom: 1.5rem; max-width: 920px; }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.6rem, 4vw, 2.5rem);
            font-weight: 700;
            text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan);
            margin-bottom: 0.5rem;
            letter-spacing: 2px;
        }
        .header p { color: var(--text-dim); font-size: 0.92rem; line-height: 1.6; }

        .last-open {
            margin-top: 0.9rem;
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.45);
            border-radius: 999px;
            padding: 6px 14px;
            font: inherit;
            font-size: 0.82rem;
            cursor: pointer;
            max-width: 100%;
        }
        .last-open[hidden] { display: none !important; }
        .last-open:hover, .last-open:focus-visible { background: rgba(0, 243, 255, 0.12); }
        .admin-link {
            display: inline-block;
            margin-top: 0.85rem;
            color: var(--text-dim);
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-decoration: none;
        }
        .admin-link:hover, .admin-link:focus-visible { color: var(--neon-cyan); }

        .filter-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-bottom: 2.2rem;
            width: 100%;
            max-width: 1100px;
        }

        .filter-btn {
            --c: var(--neon-cyan);
            background: transparent;
            padding: 8px 18px;
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid var(--c);
            color: var(--c);
            transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
        }
        .filter-btn:hover,
        .filter-btn.active,
        .filter-btn:focus-visible {
            background: var(--c);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--c);
            outline: none;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
            width: 100%;
            max-width: 1200px;
        }

        .card {
            --c: #a0a0a0;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 25px 20px;
            text-align: center;
            color: inherit;
            position: relative;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            backdrop-filter: blur(5px);
            width: 100%;
            font: inherit;
            cursor: pointer;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--c), transparent);
            transform: translateX(-100%);
            transition: transform 0.5s;
        }
        .card:hover::before, .card.is-open::before { transform: translateX(100%); }
        .card:hover, .card.is-open {
            transform: translateY(-5px);
            border-color: var(--c);
            box-shadow: 0 5px 20px color-mix(in srgb, var(--c) 28%, transparent);
        }
        .card:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }

        .tag {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            color: var(--c);
            border: 1px solid color-mix(in srgb, var(--c) 40%, transparent);
            background: color-mix(in srgb, var(--c) 12%, transparent);
        }

        .icon-box { font-size: 40px; margin-bottom: 15px; transition: 0.3s ease; color: var(--text-dim); }
        .card:hover .icon-box, .card.is-open .icon-box {
            transform: scale(1.1);
            color: var(--c);
            text-shadow: 0 0 15px color-mix(in srgb, var(--c) 55%, transparent);
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
            line-height: 1.35;
        }
        .card-desc { font-size: 0.88rem; color: var(--text-dim); line-height: 1.5; }

        .hidden { display: none !important; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .cat-A { --c: #ff00ea; }
        .cat-B { --c: #aaff00; }
        .cat-C { --c: #00f3ff; }
        .cat-D { --c: #ffaa00; }
        .cat-E { --c: #ffff00; }
        .cat-ElectiveA { --c: #00ff88; }
        .cat-ElectiveB { --c: #bc13fe; }
        .cat-ElectiveC { --c: #4d4dff; }
        .cat-DSE { --c: #ff0055; }
        .cat-Games { --c: #c8c8c8; }
        .cat-all { --c: #00f3ff; }

        .viewer {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
            --c: var(--neon-cyan);
        }
        .viewer[hidden] { display: none !important; }

        .viewer-bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-bottom: 1px solid color-mix(in srgb, var(--c) 55%, transparent);
            background: rgba(5, 5, 16, 0.96);
            flex-wrap: wrap;
        }

        .back-btn {
            background: transparent;
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            border-radius: 4px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            padding: 8px 14px;
            cursor: pointer;
            flex: 0 0 auto;
        }
        .back-btn:hover, .back-btn:focus-visible {
            background: var(--neon-cyan);
            color: var(--bg-color);
            outline: none;
        }

        .now-reading { min-width: 0; flex: 1; }
        .now-kicker {
            color: var(--text-dim);
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .now-line { display: flex; align-items: center; gap: 10px; min-width: 0; }
        .now-cat {
            position: static;
            flex: 0 0 auto;
        }
        .now-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .now-url {
            margin-top: 3px;
            color: var(--text-dim);
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .viewer-frame-wrap { position: relative; flex: 1; min-height: 0; background: #fff; }
        .viewer-frame-wrap iframe { width: 100%; height: 100%; border: 0; background: #fff; }
        .viewer-frame-wrap.is-loading::before {
            content: '載入中…';
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 2;
            color: var(--bg-color);
            background: var(--c, var(--neon-cyan));
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            letter-spacing: 1px;
            padding: 4px 8px;
            border-radius: 4px;
        }

        .embed-error {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 28px;
            text-align: center;
            background: var(--bg-color);
            color: var(--text-main);
        }
        .embed-error[hidden] { display: none !important; }
        .embed-error h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.15rem;
            margin-bottom: 10px;
            color: var(--c, var(--neon-cyan));
        }
        .embed-error p { color: var(--text-dim); line-height: 1.6; max-width: 460px; }

        @media (prefers-reduced-motion: reduce) {
            .card, .card::before, .icon-box { transition: none; }
        }

    <script>
        const CATEGORY_LABELS = {
            A: 'A',
            B: 'B',
            C: 'C',
            D: 'D',
            E: 'E',
            ElectiveA: 'Elective A',
            ElectiveB: 'Elective B',
            ElectiveC: 'Elective C',
            DSE: 'DSE',
            Games: 'Games'
        };

        const portal = document.getElementById('portal');
        const viewer = document.getElementById('viewer');
        const frame = document.getElementById('contentFrame');
        const frameWrap = document.getElementById('frameWrap');
        const embedError = document.getElementById('embedError');
        const embedErrorText = document.getElementById('embedErrorText');
        const nowCategory = document.getElementById('nowCategory');
        const nowTitle = document.getElementById('nowTitle');
        const nowUrl = document.getElementById('nowUrl');
        const lastOpen = document.getElementById('lastOpen');
        const cardContainer = document.getElementById('cardContainer');
        const LAST_KEY = 'ict-portal-last';

        let current = null;

        function escapeHtml(value) {
            return String(value).replace(/[&<>"']/g, (ch) => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            }[ch]));
        }

        function categoryLabel(category) {
            return CATEGORY_LABELS[category] || category;
        }

        function readCards() {
            return JSON.parse(document.getElementById('admin-card-data').textContent);
        }

        function renderCards() {
            cardContainer.innerHTML = readCards().map((item) => {
                const category = item.category;
                const id = item.id || item.link;
                const label = categoryLabel(category);
                return `
                    <button type="button" class="card cat-${escapeHtml(category)}"
                        data-category="${escapeHtml(category)}"
                        data-id="${escapeHtml(id)}"
                        data-href="${escapeHtml(item.link)}"
                        data-title="${escapeHtml(item.title)}">
                        <span class="tag">${escapeHtml(label)}</span>
                        <div class="icon-box"><i class="${escapeHtml(item.icon)}" aria-hidden="true"></i></div>
                        <div class="card-title">${escapeHtml(item.title)}</div>
                        <div class="card-desc">${escapeHtml(item.desc).replace(/\n/g, '<br>')}</div>
                    </button>`;
            }).join('');
        }

        function findCard(category, id) {
            return document.querySelector(
                `.card[data-category="${CSS.escape(category)}"][data-id="${CSS.escape(id)}"]`
            );
        }

        function hashFor(category, id) {
            return `#c=${encodeURIComponent(category)}&i=${encodeURIComponent(id)}`;
        }

        function parseHash() {
            const params = new URLSearchParams(location.hash.replace(/^#/, ''));
            const category = params.get('c');
            const id = params.get('i');
            if (!category || !id) return null;
            return { category, id };
        }

        function payloadFromCard(card, url) {
            const category = card.dataset.category;
            const id = card.dataset.id;
            const title = card.dataset.title;
            return {
                category,
                id,
                title,
                url: url || card.dataset.href,
                label: categoryLabel(category)
            };
        }

        function publish(state) {
            current = state;
            document.body.dataset.openCategory = state.category;
            document.body.dataset.openId = state.id;
            document.body.dataset.openTitle = state.title;
            document.body.dataset.openUrl = state.url;
            document.title = `${state.label} · ${state.title} — ICT Learning Portal`;

            viewer.className = `viewer cat-${state.category}`;
            nowCategory.className = `tag now-cat cat-${state.category}`;
            nowCategory.textContent = state.label;
            nowTitle.textContent = state.title;
            nowUrl.textContent = state.url;
            nowUrl.title = state.url;

            document.querySelectorAll('.card.is-open').forEach((card) => card.classList.remove('is-open'));
            const card = findCard(state.category, state.id);
            if (card) card.classList.add('is-open');

            document.dispatchEvent(new CustomEvent('ict-open', { detail: { ...state } }));
        }

        function remember(state) {
            const saved = {
                category: state.category,
                id: state.id,
                title: state.title,
                url: state.url
            };
            try { sessionStorage.setItem(LAST_KEY, JSON.stringify(saved)); } catch (err) {}
            showLast(saved);
        }

        function showLast(saved) {
            if (!saved) {
                lastOpen.hidden = true;
                return;
            }
            lastOpen.hidden = false;
            lastOpen.textContent = `上次開啟：${categoryLabel(saved.category)} · ${saved.title}`;
            lastOpen.dataset.category = saved.category;
            lastOpen.dataset.id = saved.id;
        }

        function track(state) {
            fetch('track_click.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    id: state.id,
                    category: state.category,
                    title: state.title,
                    url: state.url
                }),
                keepalive: true
            }).catch(() => {});
        }

        function sameDocument(url) {
            try {
                return frame.contentWindow.location.href === new URL(url, location.href).href;
            } catch (err) {
                return false;
            }
        }

        function showCard(card, options) {
            const settings = Object.assign({ historyMode: 'push', track: true, setFrame: true }, options);
            const state = payloadFromCard(card);
            publish(state);
            remember(state);
            hideEmbedError();

            portal.inert = true;
            viewer.hidden = false;
            viewer.inert = false;

            if (settings.setFrame) {
                frameWrap.classList.add('is-loading');
                if (sameDocument(state.url)) {
                    frame.contentWindow.location.reload();
                } else {
                    frame.src = state.url;
                }
            }

            const hash = hashFor(state.category, state.id);
            if (settings.historyMode === 'push') history.pushState(state, '', hash);
            else if (settings.historyMode === 'replace') history.replaceState(state, '', hash);

            if (settings.track) track(state);
            if (settings.setFrame) document.getElementById('backBtn').focus();
        }

        function showLoose(category, id, title, options) {
            if (!safeRelative(id)) return false;
            const settings = Object.assign({ historyMode: 'replace', track: false, setFrame: true }, options);
            const state = {
                category,
                id,
                title: title || id,
                url: id,
                label: categoryLabel(category)
            };
            publish(state);
            hideEmbedError();
            portal.inert = true;
            viewer.hidden = false;
            viewer.inert = false;

            if (settings.setFrame) {
                frameWrap.classList.add('is-loading');
                if (sameDocument(state.url)) frame.contentWindow.location.reload();
                else frame.src = state.url;
            }

            const hash = hashFor(state.category, state.id);
            if (settings.historyMode === 'push') history.pushState(state, '', hash);
            else if (settings.historyMode === 'replace') history.replaceState(state, '', hash);
            if (settings.track) track(state);
            return true;
        }

        function hideEmbedError() {
            embedError.hidden = true;
        }

        function showEmbedError(state) {
            embedErrorText.textContent = `已選擇 ${state.label} 的「${state.title}」（${state.url}）。這個網站不允許放進頁面，所以沒有開新分頁。`;
            embedError.hidden = false;
        }

        function resetViewer() {
            current = null;
            delete document.body.dataset.openCategory;
            delete document.body.dataset.openId;
            delete document.body.dataset.openTitle;
            delete document.body.dataset.openUrl;
            document.title = 'ICT Learning Portal';
            viewer.hidden = true;
            viewer.inert = true;
            portal.inert = false;
            hideEmbedError();
            frameWrap.classList.remove('is-loading');
            frame.src = 'about:blank';
        }

        function closeViewer() {
            const card = current ? findCard(current.category, current.id) : null;
            resetViewer();
            if (location.hash) {
                history.pushState(null, '', location.pathname + location.search);
            }
            if (card) {
                card.focus();
                card.scrollIntoView({ block: 'center' });
            }
        }

        function filterCards(category) {
            document.querySelectorAll('.filter-btn').forEach((btn) => {
                btn.classList.toggle('active', btn.dataset.category === category);
            });
            document.querySelectorAll('.card').forEach((card) => {
                const visible = category === 'all' || card.dataset.category === category;
                card.classList.toggle('hidden', !visible);
                if (visible) {
                    card.style.animation = 'none';
                    card.offsetHeight;
                    card.style.animation = 'fadeIn 0.4s ease-in-out';
                }
            });
        }

        function isAbsoluteHttp(href) {
            return /^https?:\/\//i.test(href);
        }

        function relativeFromPortal(loc) {
            const base = location.pathname.replace(/[^/]*$/, '');
            let path = loc.pathname;
            if (base && path.startsWith(base)) path = path.slice(base.length);
            return `${path.replace(/^\/+/, '')}${loc.search}${loc.hash}`;
        }

        function safeRelative(id) {
            if (typeof id !== 'string' || id.length === 0 || id.length > 300) return false;
            if (/^[a-z][a-z0-9+.-]*:/i.test(id) || id.startsWith('//') || id.startsWith('/') || id.startsWith('\\')) return false;
            return !id.split(/[\\/]/).some((part) => part === '' || part === '..');
        }

        function matchCardByLocation(loc) {
            const hits = [...document.querySelectorAll('.card')].filter((card) => {
                const href = card.dataset.href;
                try {
                    const abs = new URL(href, location.href);
                    if (isAbsoluteHttp(href)) {
                        return abs.href.replace(/\/$/, '') === loc.href.replace(/\/$/, '');
                    }
                    return abs.pathname === loc.pathname && abs.search === loc.search;
                } catch (err) {
                    return false;
                }
            });
            if (!hits.length) return null;
            return hits.find((card) => current && card.dataset.category === current.category) || hits[0];
        }

        function contain(win) {
            const doc = win.document;
            if (!doc || doc.documentElement.dataset.ictContained === '1') return;
            doc.documentElement.dataset.ictContained = '1';

            const bases = [...doc.querySelectorAll('base')];
            if (bases.length) {
                bases.forEach((base) => { base.target = 'content-frame'; });
            } else if (doc.head) {
                const base = doc.createElement('base');
                base.target = 'content-frame';
                doc.head.prepend(base);
            }

            const takeOver = (anchor) => {
                const target = (anchor.target || '').toLowerCase();
                return target === '_blank' || target === '_top' || target === '_parent' || target === '_new';
            };

            const shouldStay = (event, anchor) => {
                if (!anchor || anchor.hasAttribute('download')) return false;
                const protocol = (anchor.protocol || '').toLowerCase();
                if (protocol === 'mailto:' || protocol === 'tel:' || protocol === 'javascript:') return false;
                return takeOver(anchor) || event.metaKey || event.ctrlKey || event.shiftKey || event.button === 1;
            };

            const openHere = (event) => {
                const anchor = event.target.closest && event.target.closest('a[href]');
                if (!shouldStay(event, anchor)) return;
                event.preventDefault();
                event.stopPropagation();
                win.location.assign(anchor.href);
            };

            doc.addEventListener('click', openHere, true);
            doc.addEventListener('auxclick', openHere, true);
            doc.addEventListener('keydown', (event) => {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    closeViewer();
                }
            });
            doc.addEventListener('submit', (event) => {
                const form = event.target;
                const target = (form.target || '').toLowerCase();
                if (target === '_blank' || target === '_top' || target === '_parent') {
                    form.target = 'content-frame';
                }
            }, true);

            try {
                win.open = function (url) {
                    if (url && String(url) !== 'about:blank') win.location.assign(url);
                    return win;
                };
            } catch (err) {}
        }

        function onFrameLoad() {
            frameWrap.classList.remove('is-loading');
            if (!current) return;
            const requested = frame.getAttribute('src');
            if (!requested || requested === 'about:blank') return;

            try {
                const win = frame.contentWindow;
                const loc = win.location;
                if (!loc || loc.href === 'about:blank') {
                    showEmbedError(current);
                    return;
                }
                hideEmbedError();
                contain(win);

                const matched = matchCardByLocation(loc);
                if (matched) {
                    const changed = matched.dataset.id !== current.id || matched.dataset.category !== current.category;
                    if (changed) showCard(matched, { historyMode: 'replace', track: true, setFrame: false });
                    return;
                }

                const path = relativeFromPortal(loc);
                const title = (win.document.title || path).trim();
                if (path && path !== current.id) {
                    showLoose(current.category, path, title, { historyMode: 'replace', track: true, setFrame: false });
                }
            } catch (err) {
                hideEmbedError();
            }
        }

        function applyHash(trackOpen) {
            const parsed = parseHash();
            if (!parsed) {
                if (!viewer.hidden) resetViewer();
                return;
            }
            const card = findCard(parsed.category, parsed.id);
            if (!card) {
                showLoose(parsed.category, parsed.id, parsed.id, { historyMode: 'replace', track: trackOpen, setFrame: true });
                return;
            }
            const active = document.querySelector('.filter-btn.active');
            if (active && active.dataset.category !== 'all' && active.dataset.category !== parsed.category) {
                filterCards(parsed.category);
            }
            showCard(card, { historyMode: 'replace', track: trackOpen, setFrame: true });
        }

        document.querySelector('.filter-container').addEventListener('click', (event) => {
            const btn = event.target.closest('.filter-btn');
            if (!btn) return;
            filterCards(btn.dataset.category);
        });

        cardContainer.addEventListener('click', (event) => {
            const card = event.target.closest('.card');
            if (!card) return;
            showCard(card, { historyMode: 'push', track: true, setFrame: true });
        });

        lastOpen.addEventListener('click', () => {
            const card = findCard(lastOpen.dataset.category, lastOpen.dataset.id);
            if (card) showCard(card, { historyMode: 'push', track: true, setFrame: true });
        });

        document.getElementById('backBtn').addEventListener('click', closeViewer);
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && !viewer.hidden) closeViewer();
        });

        frame.addEventListener('load', onFrameLoad);
        window.addEventListener('popstate', () => applyHash(false));

        renderCards();
        try {
            const saved = JSON.parse(sessionStorage.getItem(LAST_KEY) || 'null');
            if (saved && saved.category && saved.id) showLast(saved);
        } catch (err) {}

        if (parseHash()) applyHash(true);

        window.ICTPortal = {
            current() { return current ? { ...current } : null; },
            open(category, id) {
                const card = findCard(category, id);
                if (!card) return false;
                showCard(card, { historyMode: 'push', track: true, setFrame: true });
                return true;
            },
            close: closeViewer
        };
    </script>
</body>
</html>
